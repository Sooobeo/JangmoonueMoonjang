[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipo-agent-eval"
version = "0.4.3.dev0"
description = "Common-contract fixed B and autonomous A0 IPO disclosure review evaluation"
requires-python = ">=3.11"
dependencies = ["openai>=2.33.0,<3", "jsonschema>=4.23,<5", "PyMuPDF>=1.24,<2", "httpx>=0.27,<1", "tiktoken>=0.8,<1", "beautifulsoup4>=4.12,<5", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["ipo_eval*"]
